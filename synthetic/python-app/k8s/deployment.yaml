apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: synthetic
  labels:
    app: auth-service
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        # Prometheus will auto-discover and scrape this pod
        prometheus.io/scrape: "true"
        prometheus.io/port:   "5000"
        prometheus.io/path:   "/metrics"
        # Loki log format hint for Promtail pipeline
        loki.grafana.com/log-format: "json"
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: SERVICE_NAME
              value: "auth-service"
            - name: SERVICE_VERSION
              value: "2.4.1"
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "5000"
            # OTel Collector endpoint — sends traces via OTLP gRPC
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,service.version=2.4.1"
            # Python unbuffered so JSON logs flush immediately
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: synthetic
spec:
  selector:
    app: auth-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  type: NodePort
