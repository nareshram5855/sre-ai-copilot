---
# Routes warning/critical alerts to the SRE AI triage webhook.
# AlertManager in Minikube -> host machine FastAPI (192.168.105.1:8080).
# continue: true so alerts also flow to the default null receiver.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: sre-ai-webhook
  namespace: monitoring
  labels:
    app: sre-ai-backend
spec:
  route:
    receiver: sre-ai-webhook
    matchers:
      - name: severity
        value: "warning|critical"
        matchType: "=~"
    groupBy: ["alertname", "namespace"]
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
    continue: true
  receivers:
    - name: sre-ai-webhook
      webhookConfigs:
        - url: "http://192.168.105.1:8080/api/v1/webhook/alertmanager"
          sendResolved: false
          maxAlerts: 5
