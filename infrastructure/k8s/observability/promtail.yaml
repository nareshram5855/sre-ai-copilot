# Promtail DaemonSet — reads /var/log/pods on each node,
# parses JSON logs, enriches with K8s labels, ships to Loki.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: warn

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
        tenant_id: synthetic

    scrape_configs:
      # Direct path scraping — reads pod log files from the host filesystem.
      # Works regardless of container runtime (Docker or containerd).
      - job_name: synthetic-pods
        static_configs:
          - targets: [localhost]
            labels:
              namespace: synthetic
              __path__: /var/log/pods/synthetic_*/*/*.log

        pipeline_stages:
          # Step 1: Parse Docker/containerd log envelope
          # Format: {"log":"<payload>","stream":"stdout","time":"..."}
          - json:
              expressions:
                log_line: log
                stream:   stream

          # Step 2: Replace the line with the inner log payload
          - replace:
              expression: "^(.*)$"
              source:     log_line
              replace:    "{{ .Value }}"

          # Step 3: Parse our app's JSON from the extracted inner line
          - json:
              source: log_line
              expressions:
                level:     level
                trace_id:  trace_id
                span_id:   span_id
                service:   service
                component: component
                msg:       msg
                env:       env

          # Step 4: Use parsed fields as labels
          - labels:
              level:
              service:
              env:

          # Step 5: Drop DEBUG to reduce volume
          - match:
              selector: '{level="DEBUG"}'
              stages:
                - drop:
                    expression: ".*"

          # Step 6: Set the log line to the inner msg for readability
          - output:
              source: log_line

        # Extract container name from the file path.
        # Path format: /var/log/pods/<ns>_<pod-name>_<uid>/<container>/<n>.log
        # The container directory name equals the app label (e.g. "order-service").
        relabel_configs:
          - source_labels: [__path__]
            regex: '.*/synthetic_[^/]+/([^/]+)/\d+\.log'
            target_label: app
          - source_labels: [__path__]
            target_label: filepath
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:3.2.0
          args: [-config.file=/etc/promtail/promtail.yaml]
          ports:
            - containerPort: 9080
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests: {memory: 64Mi,  cpu: 50m}
            limits:   {memory: 256Mi, cpu: 200m}
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
