apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: synthetic
  labels:
    app: inventory-service
    team: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
        loki.grafana.com/log-format: "json"
    spec:
      containers:
        - name: inventory-service
          image: demo-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: SERVICE_NAME
              value: "inventory-service"
            - name: SERVICE_PROFILE
              value: "inventory"
            - name: NAMESPACE
              value: "synthetic"
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "5000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests: {memory: "32Mi", cpu: "10m"}
            limits:   {memory: "256Mi", cpu: "300m"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: synthetic
spec:
  selector:
    app: inventory-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30520
  type: NodePort
