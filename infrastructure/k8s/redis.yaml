apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: sre-ai-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: sre-ai-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-ai-redis
  labels:
    app: sre-ai-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-ai-redis
  template:
    metadata:
      labels:
        app: sre-ai-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
