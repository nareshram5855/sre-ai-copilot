##
## ChromaDB — Minikube (dev) manifest
##
## Each field is annotated with its future Helm value path so Phase 4
## chart authoring is a direct lift-and-replace, not a rewrite.
##
## On EKS the PVC will bind to an EBS volume via the EBS CSI StorageClass.
## On Minikube it uses the default 'standard' (hostPath) StorageClass — fine for dev.
##

---
apiVersion: v1
kind: Namespace
metadata:
  name: sre-ai
  labels:
    app.kubernetes.io/part-of: sre-ai-copilot

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-pvc          # helm: .Values.chromadb.persistence.existingClaim
  namespace: sre-ai
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/part-of: sre-ai-copilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi            # helm: .Values.chromadb.persistence.size
  # storageClassName: gp3    # uncomment on EKS with EBS CSI driver

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: sre-ai
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/version: "0.5.20"
    app.kubernetes.io/part-of: sre-ai-copilot
spec:
  replicas: 1                 # helm: .Values.chromadb.replicaCount
  selector:
    matchLabels:
      app.kubernetes.io/name: chromadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:0.5.20   # helm: .Values.chromadb.image.tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            - name: CHROMA_SERVER_HOST
              value: "0.0.0.0"
            - name: CHROMA_SERVER_HTTP_PORT
              value: "8000"
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
          resources:
            requests:
              memory: "512Mi"   # helm: .Values.chromadb.resources.requests.memory
              cpu: "250m"
            limits:
              memory: "2Gi"     # helm: .Values.chromadb.resources.limits.memory
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chromadb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: sre-ai
  labels:
    app.kubernetes.io/name: chromadb
    app.kubernetes.io/part-of: sre-ai-copilot
spec:
  type: ClusterIP               # helm: .Values.chromadb.service.type
  selector:
    app.kubernetes.io/name: chromadb
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
