# SRE AI Copilot — Nginx config (macOS Homebrew)
#
# Ports:
#   :8090  App (React SPA + FastAPI reverse proxy)
#   :19090 Prometheus UI (proxied from minikube NodePort 30090 — no port-forward needed)
#   :13100 Loki UI       (proxied from minikube NodePort 30310 — no port-forward needed)
#
# Architecture:
#   Browser → :8090  → frontend/dist/ (static) | /api/ → gunicorn :8080
#   Browser → :19090 → minikube 192.168.105.3:30090 (Prometheus)
#   Browser → :13100 → minikube 192.168.105.3:30310 (Loki)
#   Backend         → 192.168.105.3:30090 / :30310   (direct, no port-forward)

upstream sre_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream prometheus_nodeport {
    server 192.168.105.3:30090;
    keepalive 8;
}

upstream loki_nodeport {
    server 192.168.105.3:30310;
    keepalive 8;
}

# ── App: React SPA + FastAPI ─────────────────────────────────────────────────

server {
    listen 8090;
    listen [::]:8090;
    server_name localhost 127.0.0.1 172.16.18.16;

    root /Users/shivapriya/Downloads/sre-ai/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Never cache SPA shell — avoids blank page after frontend rebuilds
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Cache fingerprinted assets forever
    location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI reverse proxy
    location /api/ {
        proxy_pass         http://sre_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location ~ ^/(health|metrics) {
        proxy_pass         http://sre_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
    }

    location /api/v1/voice/ws {
        proxy_pass         http://sre_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    access_log /tmp/sre-ai-nginx-access.log;
    error_log  /tmp/sre-ai-nginx-error.log warn;
}

# ── Prometheus UI — stable localhost proxy (no port-forward) ────────────────

server {
    listen 19090;
    server_name localhost;

    location / {
        proxy_pass         http://prometheus_nodeport;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_read_timeout 30s;
    }

    access_log off;
    error_log  /tmp/sre-ai-nginx-prom.log warn;
}

# ── Loki API — stable localhost proxy (no port-forward) ─────────────────────

server {
    listen 13100;
    server_name localhost;

    location / {
        proxy_pass         http://loki_nodeport;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_read_timeout 30s;
        proxy_buffering    off;
    }

    access_log off;
    error_log  /tmp/sre-ai-nginx-loki.log warn;
}
