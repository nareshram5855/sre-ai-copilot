apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-ai-backend
  namespace: sre-ai
  labels:
    app.kubernetes.io/name: sre-ai-backend
    app.kubernetes.io/part-of: sre-ai-copilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-ai-backend
  template:
    metadata:
      labels:
        app: sre-ai-backend
        app.kubernetes.io/name: sre-ai-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: ghcr.io/OWNER/REPO:TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: CHROMA_HOST
              value: "chromadb.sre-ai.svc.cluster.local"
            - name: CHROMA_PORT
              value: "8000"
            - name: ALLOW_EXTERNAL_LLM
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sre-ai-backend
  namespace: sre-ai
  labels:
    app.kubernetes.io/name: sre-ai-backend
spec:
  selector:
    app: sre-ai-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
